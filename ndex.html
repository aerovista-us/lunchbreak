<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Break A Leg — The Legend</title>

<style>
    body {
        margin: 0;
        background: #000;
        font-family: 'Georgia', serif;
        overflow: hidden;
        color: #fff;
    }

    /* Stage Frame */
    .stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(ellipse at center, #111 0%, #000 80%);
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }

    /* Curtains */
    .curtain {
        position: fixed;
        top: 0;
        width: 50vw;
        height: 100vh;
        background: linear-gradient(to bottom, #651212, #300000);
        z-index: 999;
        box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        animation: curtain-open 3s forwards ease-in-out;
    }
    .left { left: 0; }
    .right { right: 0; }

    @keyframes curtain-open {
        0% { width: 50vw; }
        100% { width: 0; }
    }

    /* Spotlight */
    .spotlight {
        position: absolute;
        top: -20vh;
        width: 200vw;
        height: 200vh;
        background: radial-gradient(ellipse at center,
            rgba(255,255,200,0.25) 0%,
            rgba(255,255,200,0.03) 45%,
            rgba(0,0,0,0) 70%);
        transform: rotate(5deg);
        opacity: 0;
        animation: spotlight-on 4s forwards ease-in-out;
        pointer-events: none;
    }

    @keyframes spotlight-on {
        0% { opacity: 0; }
        100% { opacity: 1; }
    }

    /* Legend Image */
    .legend-img {
        width: 60vw;
        max-width: 650px;
        opacity: 0;
        transform: scale(0.8);
        animation: reveal 4.5s forwards ease-out;
    }

    @keyframes reveal {
        0% { opacity: 0; transform: scale(0.8); }
        100% { opacity: 1; transform: scale(1); }
    }

    /* Title */
    .title {
        font-size: 3vw;
        max-width: 90vw;
        margin-bottom: 2vh;
        letter-spacing: 3px;
        text-align: center;
        text-shadow: 0 0 20px #fff;
    }

    /* Audio Player */
    .player {
        margin-top: 3vh;
        z-index: 20;
    }

    audio {
        width: 300px;
        filter: drop-shadow(0 0 8px #fff);
    }

</style>
</head>

<body>
<div class="stage">

    <!-- Spotlight -->
    <div class="spotlight"></div>

    <!-- Title -->
    <div class="title">THE LEGEND STILL MADE IT TO LUNCH</div>

    <!-- Image -->
    <img src="legend.png" class="legend-img" alt="Break a Leg Legend Image"/>

    <!-- Music Player -->
    <div class="player">
        <audio controls>
            <source src="YOUR_MP3_FILE.mp3" type="audio/mpeg">
            Your browser does not support audio playback.
        </audio>
    </div>

</div>

<!-- Curtains -->
<div class="curtain left"></div>
<div class="curtain right"></div>

</body>
</html>
